name: Update prices and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
concurrency:
  group: pages-prices
  cancel-in-progress: false
permissions: {}
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test price parser
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test calculator handlers
        run: node --test tests/*.test.cjs
      - run: python3 scripts/update_prices.py
      - name: Commit changed snapshot only
        run: |
          if ! git diff --quiet -- prices.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- prices.json
            git commit -m 'Update regional TSM prices' -- prices.json
            git push origin HEAD:main
          fi
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html prices.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
